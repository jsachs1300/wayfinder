steps:
  - name: 'node:20-bullseye'
    entrypoint: bash
    args:
      - -c
      - |
        npm ci
        npm test
    env:
      - NODE_ENV=test
      - REDIS_ENABLED=true
      - REDIS_URL=$$REDIS_URL
      - ADMIN_API_KEY=$$ADMIN_API_KEY
      - LANGCACHE_ENABLED=true
      - LANGCACHE_INTEGRATION_TEST=true
      - LANGCACHE_HOST=${_LANGCACHE_HOST}
      - LANGCACHE_CACHE_ID=${_LANGCACHE_CACHE_ID}
      - LANGCACHE_API_KEY=$$LANGCACHE_API_KEY
      - ROUTER_LLM_OPENAI_ENABLED=true
      - ROUTER_LLM_OPENAI_API_KEY=$$ROUTER_LLM_OPENAI_API_KEY
      - ROUTER_LLM_GEMINI_ENABLED=true
      - ROUTER_LLM_GEMINI_API_KEY=$$ROUTER_LLM_GEMINI_API_KEY
    secretEnv:
      - LANGCACHE_API_KEY
      - REDIS_URL
      - ROUTER_LLM_OPENAI_API_KEY
      - ROUTER_LLM_GEMINI_API_KEY
      - ADMIN_API_KEY
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --port=3000
      - --service-account=${_RUNTIME_SA}
      - --allow-unauthenticated
      - --memory=${_MEMORY}
      - --cpu=${_CPU}
      - --timeout=${_TIMEOUT}
      - --concurrency=${_CONCURRENCY}
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=${_MAX_INSTANCES}
      - --set-env-vars=NODE_ENV=production,REDIS_ENABLED=true,LANGCACHE_ENABLED=true,LANGCACHE_HOST=${_LANGCACHE_HOST},LANGCACHE_CACHE_ID=${_LANGCACHE_CACHE_ID},ROUTER_LLM_OPENAI_ENABLED=true,ROUTER_LLM_GEMINI_ENABLED=true,LOG_LEVEL=info,ALLOWED_ORIGINS=${_ALLOWED_ORIGINS}
      - --set-secrets=ADMIN_API_KEY=ADMIN_API_KEY_DEV:latest,ROUTER_LLM_OPENAI_API_KEY=ROUTER_LLM_OPENAI_API_KEY_DEV:latest,ROUTER_LLM_GEMINI_API_KEY=ROUTER_LLM_GEMINI_API_KEY_DEV:latest,REDIS_URL=REDIS_URL_DEV:latest,LANGCACHE_API_KEY=LANGCACHE_API_KEY_DEV:latest
options:
  logging: CLOUD_LOGGING_ONLY
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/LANGCACHE_API_KEY_DEV/versions/latest
      env: LANGCACHE_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/REDIS_URL_DEV/versions/latest
      env: REDIS_URL
    - versionName: projects/${PROJECT_ID}/secrets/ROUTER_LLM_OPENAI_API_KEY_DEV/versions/latest
      env: ROUTER_LLM_OPENAI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/ROUTER_LLM_GEMINI_API_KEY_DEV/versions/latest
      env: ROUTER_LLM_GEMINI_API_KEY
    - versionName: projects/${PROJECT_ID}/secrets/ADMIN_API_KEY_DEV/versions/latest
      env: ADMIN_API_KEY
substitutions:
  _REGION: us-central1
  _SERVICE: wayfinder-dev
  _REPO: wayfinder
  _IMAGE: '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/wayfinder:${COMMIT_SHA}'
  _RUNTIME_SA: 'wayfinder-runtime@${PROJECT_ID}.iam.gserviceaccount.com'
  _MEMORY: 512Mi
  _CPU: '1'
  _TIMEOUT: 300s
  _CONCURRENCY: '10'
  _MIN_INSTANCES: '1'
  _MAX_INSTANCES: '20'
  # Add additional origins (e.g., https://www.wyfndr.ai, https://staging.wyfndr.ai) as needed.
  _ALLOWED_ORIGINS: 'https://wyfndr.ai'
  _LANGCACHE_HOST: 'your-cache.langcache.redis.io'
  _LANGCACHE_CACHE_ID: 'your-cache-id'
