version: "3.9"

services:
  redis:
    image: redis:7
    container_name: wayfinder-local-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - wayfinder-local-redis-data:/data

volumes:
  wayfinder-local-redis-data:
